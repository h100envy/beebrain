<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250">
<defs><linearGradient id="l" gradientUnits="userSpaceOnUse" x1="130" y1="0" x2="1070" y2="0"><stop offset="0" stop-color="#ff4fa3"/><stop offset=".25" stop-color="#3fe08a"/><stop offset=".5" stop-color="#ffb04a"/><stop offset="1" stop-color="#c4a8ff"/></linearGradient><filter id="g" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8"/></filter></defs>
